name: HyperEdit Pro CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Set up FFmpeg on Linux & Windows
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Verify FFmpeg and FFprobe
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install HyperEdit Pro
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Environment Diagnostics
        run: |
          hyperedit doctor --verbose

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Output Pytest Failures
        if: failure()
        run: |
          echo "## Pytest Failures" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest -v --tb=short --last-failed >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "import subprocess; proc = subprocess.run(['pytest', '-q', '--tb=line', '--last-failed'], capture_output=True, text=True); [print(f'::error::{l}') for l in proc.stdout.splitlines() if 'FAILED' in l or 'ERROR' in l]"
          exit 1
