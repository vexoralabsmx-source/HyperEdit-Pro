[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperedit"
version = "0.1.0"
description = "Professional audiovisual post-production and NLE engine for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "HyperEdit Pro Core Team" }
]
keywords = [
    "video-editing",
    "audiovisual",
    "post-production",
    "ffmpeg",
    "nle",
    "agent-skills",
    "hyperframes",
    "motion-graphics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0"
]

[project.optional-dependencies]
ai = [
    "scenedetect>=0.6.0",
    "faster-whisper>=1.0.0"
]
vision = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0"
]
all = [
    "scenedetect>=0.6.0",
    "faster-whisper>=1.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0"
]

[project.urls]
Homepage = "https://github.com/vexoralabsmx-source/HyperEdit-Pro"
Repository = "https://github.com/vexoralabsmx-source/HyperEdit-Pro.git"
Issues = "https://github.com/vexoralabsmx-source/HyperEdit-Pro/issues"
Documentation = "https://github.com/vexoralabsmx-source/HyperEdit-Pro/blob/main/README.md"

[project.scripts]
hyperedit = "hyperedit.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    ".agents",
    ".claude",
    ".codex",
    ".cursor",
    "dist",
    "build",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501" # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]
"examples/*" = ["F401", "E402"]
"scripts/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["hyperedit"]
mypy_path = "src"

